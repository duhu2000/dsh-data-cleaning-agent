name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # DSH 依赖由 Host 提供；legacy-peer-deps 避免 npm 尝试拼装一套不完整的 Host。
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run check

  windows:
    name: windows (24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run check

  pr-package:
    name: PR test package
    if: github.event_name == 'pull_request'
    needs: [test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp an installable prerelease version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          node --input-type=module -e 'import fs from "node:fs";
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const [major, minor, patch] = p.version.split("-")[0].split(".").map(Number);
          p.version = [major, minor, patch + 1].join(".") + "-pr." + process.env.PR_NUMBER + "." + process.env.GITHUB_RUN_NUMBER;
          fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
      - run: npm pack --ignore-scripts
      - run: shasum -a 256 dsh-data-cleaning-agent-*.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-data-cleaning-agent-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            dsh-data-cleaning-agent-*.tgz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
