name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e 'import fs from "node:fs";
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expected = `v${version}`;
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${expected}`);
            process.exit(1);
          }'
      - name: Run release gates
        env:
          DSH_RELEASE_MODE: '1'
        run: npm run check
      # GitHub OIDC Trusted Publishing：无长期 NPM_TOKEN；需在 npm 侧绑定本仓库 + 本 workflow 后生效。
      - name: Publish to npm
        run: npm publish --access public --provenance
      # 生成 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
