name: DSH marketplace acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      # 校验 marketing/metadata.json 结构合法（schemaVersion / repository / packageName / 外部 listing 等）
      - name: Validate marketing metadata
        run: node scripts/check-marketing.mjs
